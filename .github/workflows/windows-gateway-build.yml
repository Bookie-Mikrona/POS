name: Windows gateway build

on:
  workflow_dispatch:
  push:
    paths:
      - "fiscal-service/**"
      - ".github/workflows/windows-gateway-build.yml"

jobs:
  unsigned-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build unsigned x64 PE
        shell: pwsh
        working-directory: fiscal-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt PyInstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onefile --name Bookie-Local-Gateway `
            --collect-all cryptography --collect-all lxml --hidden-import sync `
            --add-data "contract;contract" fiscal_service.py
          $pe = Get-Item dist\Bookie-Local-Gateway.exe
          if ($pe.Length -lt 1000000) { throw "Unexpectedly small executable." }
          "sha256=$((Get-FileHash $pe -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File dist\BUILD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bookie-Local-Gateway-unsigned-win-x64
          path: fiscal-service/dist/
