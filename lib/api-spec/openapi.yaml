      required: [id, enotaId, poslovniProstorId, bIdentifier, platform, status, keyFingerprintSha256]
      properties:
        id: { type: string }
        enotaId: { type: integer }
        poslovniProstorId: { type: integer }
        bIdentifier: { type: string }
        platform: { type: string, enum: [android, windows] }
        status: { type: string, enum: [provisioned, active, revoked] }
        keyFingerprintSha256: { type: string }
        expectedFursCertFingerprint: { type: [string, "null"] }
        contractVersion: { type: string }
        productionEnabled: { type: boolean }
        authorityVersion: { type: integer }
    OfflineProvisioningChallenge:
      type: object
      required: [challengeId, challenge, expiresAt]
      properties:
        challengeId: { type: string }
        challenge: { type: string }
        expiresAt: { type: string, format: date-time }
    OfflineDeviceRegistrationProof:
      type: object
      additionalProperties: false
      required: [challengeId, publicKeyPem, proofSignatureBase64, platform, bIdentifier, expectedFursCertFingerprint, goldenAttestationSha256]
      properties:
        challengeId: { type: string }
        publicKeyPem: { type: string }
        proofSignatureBase64: { type: string }
        platform: { type: string, enum: [android, windows] }
        bIdentifier: { type: string }
        expectedFursCertFingerprint: { type: string }
        goldenAttestationSha256: { type: string }
    OfflineProvisioningBundle:
      type: object
      additionalProperties: false
      required: [schema, bundleId, version, device, authority, furs, pos, sync, contract, authentication, revocation, validity, payloadSha256, signatureBase64]
      properties:
        schema: { type: string, enum: [bookie-offline-provisioning-v1] }
        bundleId: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
        version: { type: integer, minimum: 1 }
        device:
          type: object
          additionalProperties: false
          required: [id, companyId, enotaId, poslovniProstorId, poslovniProstorOznaka, bIdentifier, publicKeyFingerprintSha256]
          properties:
            id: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
            companyId: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
            enotaId: { type: integer, minimum: 1 }
            poslovniProstorId: { type: integer, minimum: 1 }
            poslovniProstorOznaka: { type: string, minLength: 1, maxLength: 20 }
            bIdentifier: { type: string, minLength: 1, maxLength: 20 }
            publicKeyFingerprintSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        authority:
          type: object
          additionalProperties: false
          required: [keyId, publicKeyPem, version, algorithm]
          properties:
            keyId: { type: string, minLength: 1 }
            publicKeyPem: { type: string }
            version: { type: integer, minimum: 1 }
            algorithm: { type: string, enum: [RSA-SHA256] }
        furs:
          type: object
          additionalProperties: false
          required: [expectedCertificateFingerprint]
          properties:
            expectedCertificateFingerprint: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        pos:
          type: object
          additionalProperties: false
          required: [allowedHttpsOrigins]
          properties:
            allowedHttpsOrigins: { type: array, minItems: 1, uniqueItems: true, items: { type: string, pattern: "^https://" } }
        sync:
          type: object
          additionalProperties: false
          required: [httpsBaseUrl, ingestPath, statusPathTemplate, configPath, maxBodyBytes]
          properties:
            httpsBaseUrl: { type: string, pattern: "^https://" }
            ingestPath: { type: string, enum: [/api/offline-fiscal/sync/receipts/ingest] }
            statusPathTemplate: { type: string, enum: ["/api/offline-fiscal/sync/receipts/status/{operationId}"] }
            configPath: { type: string, enum: [/api/offline-fiscal/sync/config] }
            maxBodyBytes: { type: integer, enum: [65536] }
        contract:
          type: object
          additionalProperties: false
          required: [version, goldenAttestationSha256]
          properties:
            version: { type: string, enum: [furs-v2] }
            goldenAttestationSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        authentication:
          type: object
          additionalProperties: false
          required: [timestampToleranceSeconds, nonceMinBits, nonceRetentionSeconds, signatureInput]
          properties:
            timestampToleranceSeconds: { type: integer, minimum: 1, maximum: 300 }
            nonceMinBits: { type: integer, minimum: 128 }
            nonceRetentionSeconds: { type: integer, minimum: 600 }
            signatureInput: { type: string, enum: ["METHOD\\nPATH_WITH_QUERY\\nTIMESTAMP\\nNONCE\\nLOWERCASE_HEX_SHA256_RAW_BODY"] }
        revocation:
          type: object
          additionalProperties: false
          required: [deviceVersion, minimumAcceptedVersion]
          properties:
            deviceVersion: { type: integer, minimum: 1 }
            minimumAcceptedVersion: { type: integer, minimum: 1 }
        validity:
          type: object
          additionalProperties: false
          required: [validFrom, validUntil]
          properties:
            validFrom: { type: string, format: date-time }
            validUntil: { type: string, format: date-time }
        payloadSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        signatureBase64: { type: string, format: byte }
    OfflineFiscalSyncStatus:
      type: object
      required: [operationId, localReceiptId, fursState, eor, receivedAt]
      properties:
        operationId: { type: string }
        localReceiptId: { type: string }
        fursState: { type: string }
        eor: { type: [string, "null"] }
        receivedAt: { type: string, format: date-time }
    OfflineAuthorityBundle:
      type: object
      required: [schema, bundleId, server, scope, contract, validity, operator, catalog, modifiers, policies, authority, bundleSha256, signatureBase64]
      properties:
        schema: { type: string, enum: [bookie-offline-authority-v1] }
        bundleId: { type: string }
        server: { type: object, additionalProperties: true }
        scope: { type: object, additionalProperties: true }
        contract: { type: object, additionalProperties: true }
        validity: { type: object, additionalProperties: true }
        operator: { type: object, additionalProperties: true }
        catalog: { type: array, items: { type: object, additionalProperties: true } }
        modifiers: { type: array, items: { type: object, additionalProperties: true } }
        policies: { type: object, additionalProperties: true }
        authority: { type: object, additionalProperties: true }
        bundleSha256: { type: string }
        signatureBase64: { type: string }
    OfflineFiscalReceiptEnvelope:
      type: object
      additionalProperties: false
      description: Device-signed immutable LegalInvoiceCore. It intentionally excludes SOAP/XML transport evidence.
      required: [envelopeVersion, operationId, localReceiptId, authorityBundle, finalizationPlan, finalizationPlanSha256, legalInvoice, zoiSignatureBase64, certificateFingerprint, deviceKeyFingerprintSha256, deviceSignatureBase64]
      properties:
        envelopeVersion: { type: string, enum: [furs-v2] }
        operationId: { type: string }
        localReceiptId: { type: string }
        authorityBundle: { $ref: "#/components/schemas/OfflineAuthorityBundle" }
        finalizationPlan: { type: object, additionalProperties: true }
        finalizationPlanSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        legalInvoice: { type: object, additionalProperties: true }
        zoiSignatureBase64: { type: string, format: byte }
        certificateFingerprint: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        deviceKeyFingerprintSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        deviceSignatureBase64: { type: string, format: byte, description: Base64 RSA-SHA256 signature of canonical LegalInvoiceCore fields }
    OfflineFiscalReceipt:
      type: object
      required: [id, localReceiptId, operationId, number, zoi, fursState, printState, submissionDeadlineAt, overdue, receivedAt]
      properties:
        id: { type: string }
        localReceiptId: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        operationId: { type: string }
        number: { type: string, description: PP-B-sequence }
        zoi: { type: string }
        eor: { type: [string, "null"] }
        fursState: { type: string, enum: [received_pending_review, pending, sending, confirmed, failed, unknown, needs_review, quarantined] }
        printState: { type: string, enum: [not_printed, printed, failed] }
        submissionDeadlineAt: { type: string, format: date-time }
        overdue: { type: boolean }
        receivedAt: { type: string, format: date-time }
        reconciliationRequired: { type: boolean }
    OfflineFiscalReceiptList:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OfflineFiscalReceipt" } }
        counts:
          type: object
          required: [total, overdue]
          properties:
            total: { type: integer }
            overdue: { type: integer }
    EmbalazaBilanca:
      type: object
      required: [artikelId, artikelIme, vrstaEmbalaze, dobaviteljId, dobaviteljIme, fizicnaKolicina, overallPhysicalStock, depozitnaVrednost, izpostavljenostDepozita]
      properties:
        artikelId: { type: integer }
        artikelIme: { type: string }
        vrstaEmbalaze: { type: [string, "null"] }
        dobaviteljId: { type: [string, "null"] }
        supplierUuid: { type: [string, "null"] }
        dobaviteljIme: { type: [string, "null"] }
        fizicnaKolicina: { type: number }
        overallPhysicalStock: { type: number }
        depozitnaVrednost: { type: [number, "null"], minimum: 0 }
        izpostavljenostDepozita: { type: number }
    EmbalazaVraciloRequest:
      type: object
      required: [artikelId, kolicina, operationKey]
      properties:
        artikelId: { type: integer, minimum: 1 }
        dobaviteljId: { type: [string, "null"] }
        kolicina: { type: number, exclusiveMinimum: 0 }
        opomba: { type: [string, "null"] }
        operationKey: { type: string }
    EmbalazaVraciloResponse:
      type: object
