openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ERP — Dvostavno Knjigovodstvo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: companies
  - name: accounts
  - name: periods
  - name: entries
    description: Journal entries (temeljnice)
  - name: ledger
    description: General ledger (glavna knjiga)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List accessible companies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of accessible companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCompaniesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a new company
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyWithRole"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Company with this tax number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get company details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyWithRole"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{id}/roles:
    post:
      operationId: assignRole
      tags: [companies]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleBody"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Chart of accounts ───────────────────────────────────────────────────────
  /companies/{companyId}/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List chart of accounts
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Accounts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create account
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/accounts/seed:
    post:
      operationId: seedAccounts
      tags: [accounts]
      summary: Import standard Slovenian chart of accounts
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Accounts seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedAccountsResponse"
        "400":
          description: Accounts already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountBody"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Accounting periods ───────────────────────────────────────────────────────
  /companies/{companyId}/periods:
    get:
      operationId: listPeriods
      tags: [periods]
      summary: List accounting periods
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Periods list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPeriodsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPeriod
      tags: [periods]
      summary: Create accounting period
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePeriodBody"
      responses:
        "201":
          description: Period created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/periods/{id}:
    patch:
      operationId: updatePeriod
      tags: [periods]
      summary: Update period status
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePeriodBody"
      responses:
        "200":
          description: Period updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Journal entries (temeljnice) ─────────────────────────────────────────────
  /companies/{companyId}/entries:
    get:
      operationId: listJournalEntries
      tags: [entries]
      summary: List journal entries
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: periodId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, posted, reversed]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Journal entries list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJournalEntriesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createJournalEntry
      tags: [entries]
      summary: Create journal entry (as draft)
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryBody"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryWithLines"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/{companyId}/entries/{id}:
    get:
      operationId: getJournalEntry
      tags: [entries]
      summary: Get journal entry with lines
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryWithLines"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/{companyId}/entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [entries]
      summary: Post a draft journal entry
      description: Validates debit=credit balance and marks entry as posted. Posting to a locked period is rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryWithLines"
        "400":
          description: Unbalanced entry or locked period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/{companyId}/entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [entries]
      summary: Reverse (storno) a posted journal entry
      description: Creates a new journal entry with swapped debit/credit lines, linked as reversal.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseJournalEntryBody"
      responses:
        "201":
          description: Reversal entry created and posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryWithLines"
        "400":
          description: Entry not posted or period locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── General ledger (konto kartica) ──────────────────────────────────────────
  /companies/{companyId}/ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: General ledger — movements per account
      description: Returns posted journal entry lines for the given filters, with running balance.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
          description: Filter by account UUID
        - name: periodId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ledger lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required: [id, email]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Company:
      type: object
      properties:
        id:
          type: string
        podjetjeDavcna:
          type: string
        naziv:
          type: string
        kratekNaziv:
          type: ["string", "null"]
        naslov:
          type: ["string", "null"]
        postnaStevika:
          type: ["string", "null"]
        kraj:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, podjetjeDavcna, naziv, createdAt]
    CompanyWithRole:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, accountant, viewer]
          required: [role]
    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyWithRole"
      required: [companies]
    CreateCompanyBody:
      type: object
      properties:
        podjetjeDavcna:
          type: string
          minLength: 8
          maxLength: 20
        naziv:
          type: string
          minLength: 1
          maxLength: 200
        kratekNaziv:
          type: string
          maxLength: 50
        naslov:
          type: string
          maxLength: 200
        postnaStevika:
          type: string
          maxLength: 10
        kraj:
          type: string
          maxLength: 100
      required: [podjetjeDavcna, naziv]
    AssignRoleBody:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [clerkUserId, role]
    RoleAssignment:
      type: object
      properties:
        companyId:
          type: string
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [companyId, clerkUserId, role]

    # ── Chart of accounts ────────────────────────────────────────────────────
    AccountRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parentId:
          type: ["string", "null"]
        isActive:
          type: boolean
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, code, name, type, isActive, createdAt, updatedAt]
    ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountRecord"
      required: [accounts]
    CreateAccountBody:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parentId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
      required: [code, name, type]
    UpdateAccountBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        parentId:
          type: ["string", "null"]
    SeedAccountsResponse:
      type: object
      properties:
        count:
          type: integer
      required: [count]

    # ── Accounting periods ───────────────────────────────────────────────────
    PeriodRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [open, locked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, name, startDate, endDate, status, createdAt, updatedAt]
    ListPeriodsResponse:
      type: object
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodRecord"
      required: [periods]
    CreatePeriodBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required: [name, startDate, endDate]
    UpdatePeriodBody:
      type: object
      properties:
        status:
          type: string
          enum: [open, locked]
        name:
          type: string
          minLength: 1
          maxLength: 100

    # ── Journal entries ───────────────────────────────────────────────────────
    JournalEntryLine:
      type: object
      properties:
        id:
          type: string
        entryId:
          type: string
        accountId:
          type: string
        accountCode:
          type: string
          description: Denormalized for display
        accountName:
          type: string
          description: Denormalized for display
        side:
          type: string
          enum: [debit, credit]
        amount:
          type: string
          description: Decimal amount as string (NUMERIC precision)
        description:
          type: ["string", "null"]
        sequence:
          type: integer
      required: [id, entryId, accountId, accountCode, accountName, side, amount, sequence]
    JournalEntry:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        periodId:
          type: string
        periodName:
          type: string
          description: Denormalized for display
        entryDate:
          type: string
          format: date
        description:
          type: string
        reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, posted, reversed]
        reversalOf:
          type: ["string", "null"]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, periodId, periodName, entryDate, description, status, createdBy, createdAt, updatedAt]
    JournalEntryWithLines:
      allOf:
        - $ref: "#/components/schemas/JournalEntry"
        - type: object
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/JournalEntryLine"
          required: [lines]
    ListJournalEntriesResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
      required: [entries]
    CreateJournalEntryLineBody:
      type: object
      properties:
        accountId:
          type: string
        side:
          type: string
          enum: [debit, credit]
        amount:
          type: number
          minimum: 0.01
          description: Positive amount; side indicates debit or credit
        description:
          type: ["string", "null"]
      required: [accountId, side, amount]
    CreateJournalEntryBody:
      type: object
      properties:
        periodId:
          type: string
        entryDate:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 500
        reference:
          type: ["string", "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CreateJournalEntryLineBody"
          minItems: 2
        autoPost:
          type: boolean
          description: If true, post the entry immediately after creation if balanced
      required: [periodId, entryDate, description, lines]
    ReverseJournalEntryBody:
      type: object
      properties:
        periodId:
          type: string
          description: Period for the reversal entry (defaults to same period)
        entryDate:
          type: string
          format: date
        description:
          type: string
      required: [entryDate]

    # ── General ledger ────────────────────────────────────────────────────────
    LedgerLine:
      type: object
      properties:
        entryId:
          type: string
        entryDate:
          type: string
          format: date
        description:
          type: string
        reference:
          type: ["string", "null"]
        accountId:
          type: string
        accountCode:
          type: string
        accountName:
          type: string
        debit:
          type: string
          description: Debit amount or "0.00"
        credit:
          type: string
          description: Credit amount or "0.00"
        runningBalance:
          type: string
          description: Running balance (debit-credit cumulative)
      required: [entryId, entryDate, description, accountId, accountCode, accountName, debit, credit, runningBalance]
    LedgerResponse:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LedgerLine"
        totalDebit:
          type: string
        totalCredit:
          type: string
      required: [lines, totalDebit, totalCredit]
