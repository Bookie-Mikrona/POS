components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Kategorija:
      type: object
      required:
        - id
        - ime
        - barva
        - vrstniRed
      properties:
        id:
          type: integer
        ime:
          type: string
        barva:
          type: string
        vrstniRed:
          type: integer
        tip:
          type: string
          nullable: true
          enum:
            - hrana
            - pijaca
        dnevnoFiltriranje:
          type: boolean
          description: Ali kategorija uporablja dnevno filtriranje modifikatorjev
    KategorijaInput:
      type: object
      required:
        - ime
        - barva
      properties:
        ime:
          type: string
          minLength: 1
        barva:
          type: string
        vrstniRed:
          type: integer
        tip:
          type: string
          nullable: true
          enum:
            - hrana
            - pijaca
        dnevnoFiltriranje:
          type: boolean
    Artikel:
      type: object
      required:
        - id
        - ime
        - cena
        - davek
        - aktiven
        - vrstniRed
      properties:
        id:
          type: integer
        ime:
          type: string
        opis:
          type:
            - string
            - "null"
        cena:
          type: number
        davek:
          type: number
          description: DDV stopnja v % (npr. 9.5 ali 22)
        aktiven:
          type: boolean
        kategorijaId:
          type:
            - integer
            - "null"
        kategorijaIme:
          type:
            - string
            - "null"
        barva:
          type:
            - string
            - "null"
          description: Hex barva ozadja kartice (npr. '#3b82f6')
        vrstniRed:
          type: integer
          description: Vrstni red prikaza v meniju
        nabavniArtikel:
          type: boolean
          description: Ali je artikel nabavni artikel
        prodajniArtikel:
          type: boolean
          description: Ali je artikel prodajni artikel
        imeZaNabavo:
          type:
            - string
            - "null"
          description: Ime artikla za nabavo (Eslog)
        enotaMere:
          type:
            - string
            - "null"
          description: Enota mere po Eslog/UNECE (npr. LTR, KOM, KGM)
        jePica:
          type: boolean
          description: Ali artikel spada med pice (za bon za pico)
        jeDodatekZaPico:
          type: boolean
          description: Ali je artikel dodatek za pico — nazajskladnost; rajši uporabi jeModifikator
        privzetiDodatki:
          type: array
          items:
            type: integer
          description: Seznam ID-jev privzetih modifikatorjev — nazajskladnost; rajši uporabi privzetiModifikatorji
        jeModifikator:
          type: boolean
          description: Ali je artikel modifikator katerega koli drugega artikla (ne prikazuje se v glavni mreži naročanja)
        privzetiModifikatorji:
          type: array
          items:
            type: integer
          description: Seznam ID-jev modifikatorjev (artiklov), ki se privzeto prednastavijo ob naročilu starševskega artikla
        toGoArtikli:
          type: array
