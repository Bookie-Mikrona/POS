          description: Ali ima artikel vsaj en vnos v normativu (receptura)
        modSkupine:
          type: array
          items:
            $ref: "#/components/schemas/ModSkupinaFull"
          description: Modifikatorske skupine prirejene artiklu
    ArtikelInput:
