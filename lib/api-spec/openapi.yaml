openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ERP — Dvostavno Knjigovodstvo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication & user info
  - name: companies
    description: Company management & access control
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List accessible companies
      description: Returns all companies the authenticated user has access to, with their role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of accessible companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCompaniesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a new company
      description: Creates a new company and assigns the creator as owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyBody"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyWithRole"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Company with this tax number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get company details
      description: Returns company details (only if user has access)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: UUID
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyWithRole"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{id}/roles:
    post:
      operationId: assignRole
      tags: [companies]
      summary: Assign role to user
      description: Assigns an accounting role to a user for this company (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleBody"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — only owners can assign roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - email
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Company:
      type: object
      properties:
        id:
          type: string
          description: UUID podjetja
        podjetjeDavcna:
          type: string
          description: Davčna številka podjetja (skupni ključ s FURS POS Web)
        naziv:
          type: string
        kratekNaziv:
          type: ["string", "null"]
        naslov:
          type: ["string", "null"]
        postnaStevika:
          type: ["string", "null"]
        kraj:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - podjetjeDavcna
        - naziv
        - createdAt
    CompanyWithRole:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, accountant, viewer]
          required:
            - role
    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyWithRole"
      required:
        - companies
    CreateCompanyBody:
      type: object
      properties:
        podjetjeDavcna:
          type: string
          description: Davčna številka podjetja (format SI12345678 ali 12345678)
          minLength: 8
          maxLength: 20
        naziv:
          type: string
          minLength: 1
          maxLength: 200
        kratekNaziv:
          type: string
          maxLength: 50
        naslov:
          type: string
          maxLength: 200
        postnaStevika:
          type: string
          maxLength: 10
        kraj:
          type: string
          maxLength: 100
      required:
        - podjetjeDavcna
        - naziv
    AssignRoleBody:
      type: object
      properties:
        clerkUserId:
          type: string
          description: Clerk user ID to assign role to
        role:
          type: string
          enum: [owner, accountant, viewer]
      required:
        - clerkUserId
        - role
    RoleAssignment:
      type: object
      properties:
        companyId:
          type: string
          description: UUID
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required:
        - companyId
        - clerkUserId
        - role
