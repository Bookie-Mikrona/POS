  /pos-monthly-invoices/partners:
    get:
      operationId: listPosMonthlyInvoicePartners
      tags: [pos]
      responses:
        "200":
          description: Active contractual customers of the selected POS unit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosMonthlyInvoicePartner"
  /pos-monthly-invoices/preview:
    get:
      operationId: previewPosMonthlyInvoice
      tags: [pos]
      parameters:
        - {name: month, in: query, required: true, schema: {type: string}}
        - {name: counterpartyId, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Unbilled contractual receipts and VAT breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosMonthlyInvoicePreview"
  /pos-monthly-invoices:
    get:
      operationId: listPosMonthlyInvoices
      tags: [pos]
      responses:
        "200":
          description: Issued monthly invoices of the selected unit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosMonthlyInvoice"
    post:
      operationId: issuePosMonthlyInvoice
      tags: [pos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosMonthlyInvoiceInput"
      responses:
        "201":
          description: Issued immutable document, or the same result on replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosMonthlyInvoice"
  /pos-monthly-invoices/{id}/pdf:
    get:
      operationId: downloadPosMonthlyInvoicePdf
      tags: [pos]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: PDF invoice with immutable daily receipt specification
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /pos-monthly-invoices/{id}/eslog:
    get:
      operationId: downloadPosMonthlyInvoiceEslog
      tags: [pos]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Native e-SLOG 2.0 XML from the issued snapshot
          content:
            application/xml:
              schema: {type: string}
        "422": {description: Issued snapshot cannot be exported safely}
  /pos-monthly-invoices/{id}/bizbox:
    get:
      operationId: getPosMonthlyInvoiceBizbox
      tags: [pos]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Persisted delivery state, without sending or contacting the provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PosMonthlyInvoiceBizbox"}
    post:
      operationId: sendPosMonthlyInvoiceBizbox
      tags: [pos]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Reserved or submitted delivery, or replay of the existing result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PosMonthlyInvoiceBizbox"}
        "409": {description: Delivery requires manual reconciliation}
        "422": {description: Missing settings or incompatible test or provider environment}
  /pos-monthly-invoices/{id}/bizbox/check:
    post:
      operationId: checkPosMonthlyInvoiceBizbox
      tags: [pos]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Delivery state after an explicit provider metadata check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PosMonthlyInvoiceBizbox"}
        "502": {description: Provider status could not be checked}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency or legal-number conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    VatFormPreview:
      type: object
      required: [form, companyId, year, period, periodMode, periodFrom, periodTo, snapshotHash, fields, partners, issues, canExport, rowCount, notice]
      properties:
        form: { type: string, enum: [DDV-O, RP-O, PD-O] }
        companyId: { type: string }
        year: { type: integer }
        period: { type: string }
        periodMode: { type: string, enum: [mesecno, trimesecno] }
        periodFrom: { type: string }
        periodTo: { type: string }
        snapshotHash: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/VatFormField" }
        partners:
          type: array
          items: { $ref: "#/components/schemas/VatFormPartner" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/VatFormIssue" }
        canExport: { type: boolean }
        rowCount: { type: integer }
        notice: { type: string }
    VatFormField:
      type: object
      required: [code, label, value]
      properties:
        code: { type: string }
        label: { type: string }
        value: { type: string }
    VatFormPartner:
      type: object
      required: [countryCode, vatId, name, values]
      properties:
        countryCode: { type: string }
        vatId: { type: string }
        name: { type: string }
        values: { type: object, additionalProperties: { type: string } }
    VatFormIssue:
      type: object
      required: [severity, message, documentNo]
      properties:
        severity: { type: string, enum: [ERROR, WARNING] }
        message: { type: string }
        documentNo: { type: ["string", "null"] }
    VatFormCorrection:
      type: object
      required: [year, month, countryCode, vatId, values]
      properties:
        year: { type: integer, minimum: 2020, maximum: 2099 }
        month: { type: integer, minimum: 1, maximum: 12 }
        countryCode: { type: string }
        vatId: { type: string }
        values: { type: object, additionalProperties: { type: string } }
    VatFormExportInput:
      type: object
      required: [form, year, period, periodMode, previewHash, confirmed]
      properties:
        form: { type: string, enum: [DDV-O, RP-O, PD-O] }
        year: { type: integer, minimum: 2020, maximum: 2099 }
        period: { type: string, pattern: "^07(0[1-9]|1[0-2])$" }
        periodMode: { type: string, enum: [mesecno, trimesecno] }
        previewHash: { type: string }
        confirmed: { type: boolean }
        refund: { type: boolean }
        deductionProportion: { type: boolean }
        contactName: { type: string }
        contactPhone: { type: string }
        corrections:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/VatFormCorrection" }
    VatFormExportResult:
      type: object
      required: [xml, filename, sha256]
      properties:
        xml: { type: string }
        filename: { type: string }
        sha256: { type: string }
    PosMonthlyInvoiceBizbox:
      type: object
      required: [state, documentId, environment, externalId, message, updatedAt, attemptCount]
      properties:
        state:
          type: string
          enum: [not_sent, sending, failed, unknown, submitted, processing, delivered, rejected]
        documentId: {type: [string, "null"]}
        environment: {type: [string, "null"]}
        externalId: {type: [string, "null"]}
        message: {type: [string, "null"]}
        updatedAt: {type: [string, "null"]}
        attemptCount: {type: integer}
    PosMonthlyInvoicePartner:
      type: object
      required: [id, name, paymentTermsDays]
      properties:
        id: {type: string}
        name: {type: string}
        paymentTermsDays: {type: integer}
    PosMonthlyInvoiceReceipt:
      type: object
      required: [id, number, date, gross]
      properties:
        id: {type: integer}
        number: {type: string}
        date: {type: string}
        gross: {type: string}
    PosMonthlyInvoiceVat:
      type: object
      required: [rate, net, vat, gross]
      properties:
        rate: {type: string}
        net: {type: string}
        vat: {type: string}
        gross: {type: string}
    PosMonthlyInvoiceLine:
      type: object
      required: [label, quantity, gross, rate]
      properties:
        label: {type: string}
        quantity: {type: string}
        gross: {type: string}
        rate: {type: string}
    PosMonthlyInvoicePreview:
      type: object
      required: [month, counterpartyId, recipientName, paymentTermsDays, receiptCount, isTest, totalNet, totalVat, totalGross, receipts, vatBuckets, lines]
      properties:
        month: {type: string}
        counterpartyId: {type: string}
        recipientName: {type: string}
        paymentTermsDays: {type: integer}
        receiptCount: {type: integer}
        isTest: {type: boolean}
        totalNet: {type: string}
        totalVat: {type: string}
        totalGross: {type: string}
        receipts:
          type: array
          items: {$ref: "#/components/schemas/PosMonthlyInvoiceReceipt"}
        vatBuckets:
          type: array
          items: {$ref: "#/components/schemas/PosMonthlyInvoiceVat"}
        lines:
          type: array
          items: {$ref: "#/components/schemas/PosMonthlyInvoiceLine"}
    PosMonthlyInvoiceInput:
      type: object
      required: [month, counterpartyId, invoiceDate, dueDate, expectedReceiptIds, idempotencyKey]
      properties:
        month: {type: string}
        counterpartyId: {type: string}
        invoiceDate: {type: string}
        dueDate: {type: string}
        expectedReceiptIds:
          type: array
          items: {type: integer}
        idempotencyKey: {type: string}
    PosMonthlyInvoice:
      type: object
      required: [id, invoiceNumber, month, invoiceDate, dueDate, counterpartyName, receiptCount, totalGross, isTest]
      properties:
        id: {type: string}
        invoiceNumber: {type: string}
        month: {type: string}
        invoiceDate: {type: string}
        dueDate: {type: string}
        counterpartyName: {type: string}
        receiptCount: {type: integer}
        totalGross: {type: string}
        isTest: {type: boolean}
    AjpesAnnualProfile:
      type: object
      required: [legalForm, framework, size, periodStart, periodEnd, currentCriteria, previousCriteria, sizeBasis, previousYearException, microRegime, auditRequired, groupMember, consolidationRequired, simplifiedSubmission, foreignOperations, sfrRequired, cppsRequired, listed, specialRegime, confirmationBasis, confirmed]
      properties:
        legalForm: {type: string, enum: [unknown, doo, dd, sp, cooperative, other]}
        framework: {type: string, enum: [unknown, SRS, IFRS]}
        size: {type: string, enum: [unknown, micro, small, medium, large]}
        periodStart: {type: string}
        periodEnd: {type: string}
        currentCriteria: {$ref: "#/components/schemas/AjpesSizeCriteria"}
        previousCriteria: {$ref: "#/components/schemas/AjpesSizeCriteria"}
        sizeBasis: {type: string, maxLength: 4096}
        previousYearException: {type: string, maxLength: 4096}
        microRegime: {$ref: "#/components/schemas/AjpesProfileDecision"}
        auditRequired: {$ref: "#/components/schemas/AjpesProfileDecision"}
        groupMember: {$ref: "#/components/schemas/AjpesProfileDecision"}
        consolidationRequired: {$ref: "#/components/schemas/AjpesProfileDecision"}
        simplifiedSubmission: {$ref: "#/components/schemas/AjpesProfileDecision"}
        foreignOperations: {$ref: "#/components/schemas/AjpesProfileDecision"}
        sfrRequired: {$ref: "#/components/schemas/AjpesProfileDecision"}
        cppsRequired: {$ref: "#/components/schemas/AjpesProfileDecision"}
        listed: {$ref: "#/components/schemas/AjpesProfileDecision"}
        specialRegime: {$ref: "#/components/schemas/AjpesProfileDecision"}
        confirmationBasis: {type: string, maxLength: 4096}
        confirmed: {type: boolean}
    AjpesProfileDecision:
      type: string
      enum: [unknown, yes, no]
    AjpesSizeCriteria:
      type: object
      required: [assets, revenue, employees]
      properties:
        assets: {type: string, maxLength: 32}
        revenue: {type: string, maxLength: 32}
        employees: {type: string, maxLength: 32}
    AjpesReportingObligation:
      type: object
      required: [code, label, purpose, status, available, explanation]
      properties:
        code: {type: string}
        label: {type: string}
        purpose: {type: string, enum: [statistics, publication, periodic]}
        status: {type: string, enum: [required, conditional, not_required]}
        available: {type: boolean}
        explanation: {type: string}
    AjpesProfileAssessment:
      type: object
      required: [rulesVersion, catalogYear, supported, confirmed, obligations, issues, sources]
      properties:
        rulesVersion: {type: string}
        catalogYear: {type: integer}
        supported: {type: boolean}
        confirmed: {type: boolean}
        obligations: {type: array, items: {$ref: "#/components/schemas/AjpesReportingObligation"}}
        issues: {type: array, items: {$ref: "#/components/schemas/AjpesReportIssue"}}
        sources: {type: array, items: {type: string}}
    AjpesProfitProposal:
      type: object
      required: [text, preparedBy, preparedDate]
      properties:
        text: {type: string, maxLength: 20000}
        preparedBy: {type: string, maxLength: 250}
        preparedDate: {type: string, maxLength: 10}
    AjpesProfitDecision:
      type: object
      required: [text, adoptedBy, adoptedDate, reference, adopted]
      properties:
        text: {type: string, maxLength: 20000}
        adoptedBy: {type: string, maxLength: 250}
        adoptedDate: {type: string, maxLength: 10}
        reference: {type: string, maxLength: 250}
        adopted: {type: boolean}
    AjpesSimplifiedStatement:
      type: object
      required: [text, signatory, date, confirmed]
      properties:
        text: {type: string, maxLength: 5000}
        signatory: {type: string, maxLength: 250}
        date: {type: string, maxLength: 10}
        confirmed: {type: boolean}
    AjpesAnnualNarrative:
      type: object
      required: [accountingPolicies, explanations, disclosure4, disclosure5, disclosure6, disclosure10, historicalCostConfirmed, profitProposal, profitDecision, simplifiedStatement]
      properties:
        accountingPolicies: {type: string, maxLength: 50000}
        explanations: {type: string, maxLength: 50000}
        disclosure4: {type: string, maxLength: 12000}
        disclosure5: {type: string, maxLength: 12000}
        disclosure6: {type: string, maxLength: 12000}
        disclosure10: {type: string, maxLength: 12000}
        historicalCostConfirmed: {type: boolean}
        profitProposal: {$ref: "#/components/schemas/AjpesProfitProposal"}
        profitDecision: {$ref: "#/components/schemas/AjpesProfitDecision"}
        simplifiedStatement: {$ref: "#/components/schemas/AjpesSimplifiedStatement"}
    AjpesPublicationReview:
      type: object
      description: Server-owned approval of the exact publication snapshot; ignored in draft settings input.
      required: [fingerprint, reviewedBy, reviewedAt]
      properties:
        fingerprint: {type: string}
        reviewedBy: {type: string}
        reviewedAt: {type: string}
    AjpesPublicationDocument:
      type: object
      required: [code, label, status]
      properties:
        code: {type: string}
        label: {type: string}
        status: {type: string, enum: [present, missing, not_required]}
    AjpesPublicationSection:
      type: object
      required: [code, label, text]
      properties:
        code: {type: string}
        label: {type: string}
        text: {type: string}
    AjpesPublicationAssessment:
      type: object
      required: [rulesVersion, supported, mode, ready, reviewed, canExport, contentFingerprint, documents, sections, issues]
      properties:
        rulesVersion: {type: string}
        supported: {type: boolean}
        mode: {type: string, enum: [notes, micro, unknown]}
        ready: {type: boolean}
        reviewed: {type: boolean}
        canExport: {type: boolean}
        contentFingerprint: {type: string}
        documents: {type: array, items: {$ref: "#/components/schemas/AjpesPublicationDocument"}}
        sections: {type: array, items: {$ref: "#/components/schemas/AjpesPublicationSection"}}
        issues: {type: array, items: {$ref: "#/components/schemas/AjpesReportIssue"}}
    AjpesAnnualSettings:
      type: object
      required: [mappings, mappingReasons, currentValues, previousValues, excludedEntryIds, metadata]
      properties:
        mappings: {type: object, additionalProperties: {type: string}}
        mappingReasons: {type: object, additionalProperties: {type: string}}
        currentValues: {type: object, additionalProperties: {type: string}}
        previousValues: {type: object, additionalProperties: {type: string}}
        excludedEntryIds: {type: array, items: {type: string}}
        metadata:
          type: object
          additionalProperties: {type: string}
        profile: {$ref: "#/components/schemas/AjpesAnnualProfile"}
        narrative: {$ref: "#/components/schemas/AjpesAnnualNarrative"}
        publicationReview: {$ref: "#/components/schemas/AjpesPublicationReview"}
    AjpesAnnualDraftInput:
      type: object
      required: [revision, settings]
      properties:
        revision: {type: integer, minimum: 0}
