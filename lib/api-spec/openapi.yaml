  /companies/{companyId}/partner-ledger:
    get:
      operationId: getPartnerLedger
      tags: [partner-ledger]
      summary: Chronological partner GL card
      description: >
        Requires one partner and one account. Returns partner-tagged posted/reversed GL lines, chronological running
        balance and independent open debit/credit amounts. dateFrom only filters returned lines;
        opening/running balance is calculated from the complete flow through dateTo. Drafts are
        read-only and require mode=drafts; draft data is never included by default and is unsuitable
        for settlement/payment preparation. Missing historic counterparts are retained as evidence
        warnings, never manufactured as postings.
        Imported opening vouchers are balance metadata, not returned documents; later annual
        carryforwards are excluded to avoid counting the same history repeatedly.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: partnerId, in: query, required: true, schema: { type: string } }
        - { name: accountId, in: query, required: true, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date }, description: "As-of cut-off; defaults to today." }
        - { name: openOnly, in: query, schema: { type: boolean }, description: "Filters returned lines only; does not alter running balance." }
        - { name: mode, in: query, schema: { type: string, enum: [posted, drafts], default: posted }, description: "Drafts is a separate read-only comparison mode." }
      responses:
        "200":
          description: Partner card
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOfDate: { type: string, format: date }
                  dateFrom: { type: string, format: date, nullable: true }
                  mode: { type: string, enum: [posted, drafts] }
                  openingBalance:
                    type: string
                    nullable: true
                    description: "Opening balance for the selected account; null for a multi-account card."
                  closingBalance:
                    type: string
                    description: Full selected ledger balance at the cutoff, unaffected by openOnly.
                  openingBalances:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: { type: string }
                        accountCode: { type: string }
                        accountName: { type: string }
                        balance: { type: string }
                      required: [accountId, accountCode, accountName, balance]
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        lineId: { type: string }
                        partnerId: { type: string }
                        partnerName: { type: string }
                        partnerCity: { type: string, nullable: true }
                        accountId: { type: string }
                        accountCode: { type: string }
                        accountName: { type: string }
                        entryId: { type: string }
                        entryStatus: { type: string, enum: [posted, reversed, draft] }
                        documentType: { type: string }
                        documentNumber: { type: string, nullable: true }
                        description: { type: string }
                        documentDate: { type: string, format: date, nullable: true }
                        postingDate: { type: string, format: date }
                        taxDate: { type: string, format: date, nullable: true }
                        dueDate: { type: string, format: date, nullable: true }
                        durDate:
                          type: string
                          format: date
                          nullable: true
                          description: Original GLAVNA Dat_dur (DUR), not the ERP invoice-receipt date.
                        originalDocumentNumber:
                          type: string
                          nullable: true
                          description: Original GLAVNA Stevilka voucher/document number.
                        debit: { type: string }
                        credit: { type: string }
                        runningBalance: { type: string }
                        openDebit: { type: string, description: "Open debit amount; intentionally not netted against open credit." }
                        openCredit: { type: string, description: "Open credit amount; intentionally not netted against open debit." }
                        closings: { type: array, items: { type: object, additionalProperties: true } }
                      required: [lineId, partnerId, partnerName, accountId, accountCode, accountName, entryId, entryStatus, debit, credit, runningBalance, openDebit, openCredit, closings]
                required: [asOfDate, dateFrom, mode, openingBalance, openingBalances, lines]
        "401": { description: Unauthorized }
        "403": { description: Company access denied }
        "400": { description: Invalid filter }
  /companies/{companyId}/partner-ledger/pdf:
    get:
      operationId: getPartnerLedgerPdf
