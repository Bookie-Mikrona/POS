        reference: { type: string }
    EmbalazaOdpisRequest:
      type: object
      required: [artikelId, dobaviteljId, kolicina, razlog, operationKey]
      properties:
        artikelId: { type: integer, minimum: 1 }
        dobaviteljId: { type: string }
        kolicina: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        razlog: { type: string, enum: [razbitje, uniceno, nevracljivo] }
        opomba: { type: [string, "null"], maxLength: 2000 }
        operationKey: { type: string }
    EmbalazaOdpisResponse:
      type: object
      required: [id, kolicina, journalEntryId, reference]
      properties:
        id: { type: integer }
        kolicina: { type: number }
        journalEntryId: { type: [string, "null"] }
        reference: { type: string }
    OfflineFiscalClaimResult:
      type: object
