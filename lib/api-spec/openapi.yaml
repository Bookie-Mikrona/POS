    CreatePaymentBatchBody:
      type: object
      description: Supply either saved paymentIds or periodId, paymentDate and proposedPayments. The server validates these mutually exclusive modes atomically.
      properties:
        bankAccountId: { type: string }
        periodId: { type: string, description: Required with proposedPayments }
        paymentDate: { type: string, format: date, description: Required with proposedPayments }
        cutoffDate: { type: string, format: date, description: Optional due-date cutoff for selected invoices }
        paymentIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string }
        proposedPayments:
          type: array
          minItems: 1
          maxItems: 500
          description: Direct supplier/AP-account groups. The server splits groups further when creditor instructions are incompatible.
          items:
            type: object
            properties:
              counterpartyId: { type: string }
              arApAccountId: { type: string }
              allocations:
                type: array
                minItems: 1
                items: { $ref: "#/components/schemas/PaymentBatchProposedAllocation" }
            required: [counterpartyId, arApAccountId, allocations]
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
      required: [bankAccountId, idempotencyKey]
    PaymentBatchProposedAllocation:
      type: object
      description: Exactly one of invoiceId or journalLineId is required; the server validates the target atomically.
      properties:
        invoiceId: { type: string }
        journalLineId: { type: string }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
      required: [amount]
    CreatePaymentBatchResponse:
      type: object
      properties:
        batchId: { type: string }
        batch: { $ref: "#/components/schemas/PaymentBatchRecord" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentWithAllocations" }
        replayed: { type: boolean }
      required: [batchId, batch, payments]
