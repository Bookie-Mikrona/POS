openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ERP — Dvostavno Knjigovodstvo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: companies
  - name: accounts
  - name: periods
  - name: entries
    description: Journal entries (temeljnice)
  - name: ledger
    description: General ledger (glavna knjiga)
  - name: counterparties
    description: Customers & suppliers (kupci in dobavitelji)
  - name: invoices
    description: Issued & received invoices (računi)
  - name: payments
    description: Payments, open items & aged analysis (plačila, saldakonti)
  - name: vat
    description: VAT codes, VAT register & DDV-O return (DDV šifranti, knjiga IR/PR, obračun)
  - name: storage
    description: Object storage upload and serving endpoints
  - name: documents
    description: AI/OCR document processing — upload, extract, propose & confirm (AI obdelava dokumentov)
  - name: anthropic
    description: Anthropic AI chat operations
  - name: dimensions
    description: Analytic dimensions — cost centers, projects, departments (stroškovna mesta, projekti, oddelki)
  - name: reports
    description: Financial reports — balance sheet, income statement (bilanca stanja, izkaz poslovnega izida)
  - name: admin
    description: Administratorski pregledi
  - name: blagajne
    description: FURS blagajne (poslovni prostori in elektronske naprave)
  - name: izmene
    description: Izmene / delovne izmene natakarjev
  - name: enote
    description: Poslovne enote (multi-location)
  - name: natakari
    description: Natakari / operaterji blagajne
  - name: kategorije
    description: Kategorije menijev
  - name: artikli
    description: Artikli menija
  - name: mize
    description: Mize v restavraciji
  - name: prostori
    description: Prostori (sekcije) v restavraciji
  - name: narocila
    description: Naročila
  - name: dostava
    description: Upravljanje dostav in kurirjev
  - name: racuni
    description: Fiscalni računi (FURS)
  - name: statistike
    description: Statistike in poročila
  - name: nastavitve
    description: Sistemske nastavitve
  - name: naprave
    description: POS naprave (identifikacija in per-napravne nastavitve)
  - name: terminal
    description: Payten POS terminal (kartično plačilo)
  - name: zaloge
    description: Vodenje zalog vhodnih artiklov
  - name: prejemnice
    description: Prejemnice vhodnega blaga
  - name: nabava
    description: Naročila dobaviteljem in ponovno naročanje
  - name: inventure
    description: Inventurni popisi zalog
  - name: modifikatorji
    description: Modifikatorske skupine in modifikatorji artiklov
  - name: dnevniMeni
    description: Tedenski/dnevni meni za filtriranje modifikatorjev
  - name: plate-waste
    description: Ločena interna evidenca ostankov s krožnikov
  - name: events
    description: Veselice, poroke, catering in drugi gostinski dogodki
  - name: kds
    description: Konfiguracija logičnih KDS postaj in prikazovalnikov po enoti
  - name: daily-lunch
    description: Unit and business-date scoped daily lunch offers
paths:
  /companies/{companyId}/vat-form-preview:
    get:
      operationId: getVatFormPreview
      tags: [VAT]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: form, in: query, required: true, schema: { type: string, enum: [DDV-O, RP-O, PD-O] } }
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2099 } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^07(0[1-9]|1[0-2])$" } }
        - { name: periodMode, in: query, required: true, schema: { type: string, enum: [mesecno, trimesecno] } }
      responses:
        "200":
          description: Predogled iz istega davčnega vira kot izvoz, brez knjiženja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatFormPreview" }
        "400": { description: Neveljavno obdobje }
        "403": { description: Dostop ni dovoljen }
  /companies/{companyId}/vat-form-export:
    post:
      operationId: exportVatForm
      tags: [VAT]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VatFormExportInput" }
      responses:
        "200":
          description: XML za ročni uvoz, ne davčna oddaja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatFormExportResult" }
        "400": { description: Izvoz je blokiran }
        "403": { description: Potrebna je vloga računovodje }
        "409": { description: Davčni vir se je od pregleda spremenil }
  /temeljnice/izvoz:
    get:
      operationId: exportPosJournalEntries
      tags: [entries]
      summary: Izvozi temeljnice aktivnega podjetja za izbrano obdobje
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: header, name: X-Enota-Id, required: true, schema: { type: integer } }
        - { in: query, name: od, required: true, schema: { type: string } }
        - { in: query, name: do, required: true, schema: { type: string } }
        - { in: query, name: format, required: true, schema: { type: string, enum: [xlsx, csv] } }
      responses:
        "200":
          description: Popoln izvoz vrstic temeljnic brez samodejnega prenosa v GK
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        "400":
          description: Neveljavno obdobje ali format izvoza
        "404":
          description: V izbranem obdobju ni temeljnic
  /temeljnice/prenos-v-gk:
    post:
      operationId: transferPosBookingDrafts
      tags: [entries]
      summary: Izrecno prenesi izbrane POS osnutke v interno GK
      description: Zahteva POS administratorja podjetja, vključen ERP modul in odprta obdobja. Nikoli ne knjiži samodejno in ne prepiše že prenesenih temeljnic.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Enota-Id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, confirmed]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                confirmed:
                  type: boolean
                  const: true
      responses:
        "200":
          description: Ustvarjeni osnutki in že prenesene temeljnice
          content:
            application/json:
              schema:
                type: object
                required: [created, alreadyTransferred]
                properties:
                  created:
                    type: array
                    items: { type: string }
                  alreadyTransferred:
                    type: array
                    items: { type: string }
        "400":
          description: Manjka potrditev, veljavna izbira, ERP modul ali odprto obdobje
        "403":
          description: Prenos je dovoljen samo administratorju podjetja
  /companies/{companyId}/reports/ajpes/{year}:
    get:
      operationId: getAjpesAnnualReport
      tags: [Reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      responses:
        "200":
          description: Annual reporting draft and fresh general-ledger comparison
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AjpesAnnualReport"}
        "403": {description: Company access denied}
    put:
      operationId: saveAjpesAnnualReport
      tags: [Reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AjpesAnnualDraftInput"}
      responses:
        "200":
          description: Saved draft recalculated against current ledger
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AjpesAnnualReport"}
        "400": {description: Invalid reporting inputs}
        "403": {description: Read-only role or foreign company}
        "409": {description: Draft revision or underlying ledger changed}
  /companies/{companyId}/reports/ajpes/{year}/history:
    get:
      operationId: getAjpesAnnualHistory
      tags: [reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        "200":
          description: Archived exports and manually recorded receipts, not an AJPES API verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AjpesAnnualHistory"}
  /companies/{companyId}/reports/ajpes/{year}/history/exports/{exportId}/download:
    get:
      operationId: downloadAjpesAnnualArchive
      tags: [reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer}}
        - {name: exportId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Original archived bytes, never regenerated from the latest ledger
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /companies/{companyId}/reports/ajpes/{year}/history/uploads:
    post:
      operationId: requestAjpesEvidenceUpload
      tags: [reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AjpesEvidenceUploadRequest"}
      responses:
        "200":
          description: Reserved private upload; this is not yet submission evidence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AjpesEvidenceUpload"}
  /companies/{companyId}/reports/ajpes/{year}/history/submissions:
    post:
      operationId: recordAjpesSubmission
      tags: [reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AjpesSubmissionRequest"}
      responses:
        "200":
          description: Verified file attached to a manually attested outcome, not electronic filing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AjpesSubmission"}
  /companies/{companyId}/reports/ajpes/{year}/history/submissions/{submissionId}/download:
    get:
      operationId: downloadAjpesSubmissionEvidence
      tags: [reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer}}
        - {name: submissionId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Authorized download of the immutable receipt
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /companies/{companyId}/reports/ajpes/{year}/export:
    post:
      operationId: exportAjpesAnnualReport
      tags: [Reports]
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string}}
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AjpesAnnualExportInput"}
      responses:
        "200":
          description: Reviewed annual report download (XLSX, PDF or official AJPES XML)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {description: Invalid format or unsupported official XML year}
        "403": {description: Company access denied}
        "409": {description: Preview is stale; reload and review again}
        "422": {description: Incomplete or inconsistent annual report}
  /companies/{companyId}/credit-note-packaging-documents:
    get:
      operationId: listCreditNotePackagingDocuments
      tags: [prejemnice]
      parameters: [{ name: companyId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Dobropisi, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNotePackagingDocumentsResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /companies/{companyId}/prejemnice/{receiptId}/credit-note-packaging:
    get:
      operationId: listCreditNotePackaging
      tags: [prejemnice]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: receiptId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Dobropisne vrstice, kandidati in zgodovina
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditNotePackagingResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /companies/{companyId}/prejemnice/{receiptId}/credit-note-packaging/confirm:
    post:
      operationId: confirmCreditNotePackaging
      tags: [prejemnice]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: receiptId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationKey, prejemnicaPostavkaId, embalazniPrometId, quantity]
              properties:
                operationKey: { type: string }
                prejemnicaPostavkaId: { type: integer }
                embalazniPrometId: { type: integer }
                quantity: { type: number, exclusiveMinimum: 0 }
      responses:
        "200": { description: Potrjena ali idempotentno ponovljena dodelitev, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNotePackagingAllocation" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /companies/{companyId}/prejemnice/{receiptId}/credit-note-packaging/{allocationId}/reverse:
    post:
      operationId: reverseCreditNotePackaging
      tags: [prejemnice]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: receiptId, in: path, required: true, schema: { type: integer } }
        - { name: allocationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationKey]
              properties: { operationKey: { type: string } }
      responses:
        "200": { description: Reversal audit row, content: { application/json: { schema: { $ref: "#/components/schemas/CreditNotePackagingAllocation" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /kds/nastavitve:
    get:
      operationId: getKdsNastavitve
      tags: [kds]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KdsNastavitve" } } } }
    put:
      operationId: updateKdsNastavitve
      tags: [kds]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsNastavitveInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KdsNastavitve" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /kds/postaje:
    get:
      operationId: listKdsPostaje
      tags: [kds]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KdsPostaja" } } } } }
    post:
      operationId: createKdsPostaja
      tags: [kds]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPostajaInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPostaja" } } } }
  /kds/postaje/{id}:
    patch:
      operationId: updateKdsPostaja
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPostajaUpdate" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPostaja" } } } } }
    delete:
      operationId: deleteKdsPostaja
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { "204": { description: Deleted } }
  /kds/postaje/{id}/mapiranja:
    get:
      operationId: listKdsMapiranja
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KdsMapiranje" } } } } } }
    post:
      operationId: createKdsMapiranje
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsMapiranjeInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KdsMapiranje" } } } } }
  /kds/postaje/{id}/mapiranja/{mappingId}:
    delete:
      operationId: deleteKdsMapiranje
      tags: [kds]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: mappingId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses: { "204": { description: Deleted } }
  /kds/prikazovalniki:
    get:
      operationId: listKdsPrikazovalniki
      tags: [kds]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KdsPrikazovalnik" } } } } } }
    post:
      operationId: createKdsPrikazovalnik
      tags: [kds]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPrikazovalnikInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPrikazovalnik" } } } } }
  /kds/prikazovalniki/{id}:
    patch:
      operationId: updateKdsPrikazovalnik
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPrikazovalnikUpdate" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KdsPrikazovalnik" } } } } }
    delete:
      operationId: deleteKdsPrikazovalnik
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { "204": { description: Deleted } }
  /kds/prikazovalniki/{id}/narocnine:
    put:
      operationId: setKdsPrikazovalnikNarocnine
      tags: [kds]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsNarocnineInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KdsNarocnine" } } } } }
  /kds/nerazporejene-postavke:
    get:
      operationId: listKdsNerazporejenePostavke
      tags: [kds]
      summary: Aktivni artikli brez aktivnega item/category usmerjanja
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KdsNerazporejenaPostavka" } } } } } }
  /kds/izdaja:
    get:
      operationId: listKdsIzdaja
      tags: [kds]
      summary: Odprta naročila, pripravljena za predajo
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KdsIzdajaNarocilo" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /kds/narocila/{narociloId}/izdaj:
    post:
      operationId: issueKdsNarocilo
      tags: [kds]
      parameters: [{ name: narociloId, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KdsIzdajaInput" } } } }
      responses:
        "200": { description: Predano ali idempotentno ponovljeno, content: { application/json: { schema: { $ref: "#/components/schemas/KdsIzdajaRezultat" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Naročilo ni pripravljeno, ni odprto ali je že predano" }
  /admin/import-users:
    post:
      operationId: importUsers
      tags:
        - admin
      summary: Uvoz uporabnikov iz CSV datoteke
      responses:
        "200":
          description: Rezultat uvoza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UvozUporabnikovRezultat"
        "400":
          description: Napačna datoteka ali format
          content:
            application/json:
              schema:
                type: object
                required:
                  - napaka
                properties:
                  napaka:
                    type: string
  /admin/testni-zagoni:
    get:
      operationId: listTestniZagoni
      tags:
        - admin
      summary: Zadnji zagoni testov
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestniZagonPogled"
  /admin/companies/{id}/event-transfer-diagnostics:
    get:
      operationId: getAdminEventTransferDiagnostics
      tags:
        - admin
      summary: Read-only diagnostika dogodkovnih prenosov zaloge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: unitId
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Diagnostično poročilo brez sprememb podatkov
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTransferDiagnosticReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/companies/{id}/event-transfer-diagnostics/events/{eventId}:
    get:
      operationId: getAdminEventTransferDetail
      tags:
        - admin
      summary: Read-only podrobnosti dogodka in njegovih prenosov zaloge
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: eventId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
