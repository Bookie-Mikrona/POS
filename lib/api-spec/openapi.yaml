openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ERP — Dvostavno Knjigovodstvo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: companies
  - name: accounts
  - name: periods
  - name: entries
    description: Journal entries (temeljnice)
  - name: ledger
    description: General ledger (glavna knjiga)
  - name: counterparties
    description: Customers & suppliers (kupci in dobavitelji)
  - name: invoices
    description: Issued & received invoices (računi)
  - name: payments
    description: Payments, open items & aged analysis (plačila, saldakonti)
  - name: vat
    description: VAT codes, VAT register & DDV-O return (DDV šifranti, knjiga IR/PR, obračun)
  - name: storage
    description: Object storage upload and serving endpoints
  - name: documents
    description: AI/OCR document processing — upload, extract, propose & confirm (AI obdelava dokumentov)
  - name: anthropic
    description: Anthropic AI chat operations
  - name: dimensions
    description: Analytic dimensions — cost centers, projects, departments (stroškovna mesta, projekti, oddelki)
  - name: reports
    description: Financial reports — balance sheet, income statement (bilanca stanja, izkaz poslovnega izida)
  - name: admin
    description: Administratorski pregledi
  - name: blagajne
    description: FURS blagajne (poslovni prostori in elektronske naprave)
  - name: izmene
    description: Izmene / delovne izmene natakarjev
  - name: enote
    description: Poslovne enote (multi-location)
  - name: natakari
    description: Natakari / operaterji blagajne
  - name: kategorije
    description: Kategorije menijev
  - name: artikli
    description: Artikli menija
  - name: mize
    description: Mize v restavraciji
  - name: prostori
    description: Prostori (sekcije) v restavraciji
  - name: narocila
    description: Naročila
  - name: racuni
    description: Fiscalni računi (FURS)
  - name: statistike
    description: Statistike in poročila
  - name: nastavitve
    description: Sistemske nastavitve
  - name: naprave
    description: POS naprave (identifikacija in per-napravne nastavitve)
  - name: terminal
    description: Payten POS terminal (kartično plačilo)
  - name: zaloge
    description: Vodenje zalog vhodnih artiklov
  - name: prejemnice
    description: Prejemnice vhodnega blaga
  - name: inventure
    description: Inventurni popisi zalog
  - name: modifikatorji
    description: Modifikatorske skupine in modifikatorji artiklov
  - name: dnevniMeni
    description: Tedenski/dnevni meni za filtriranje modifikatorjev
paths:
  /admin/import-users:
    post:
      operationId: importUsers
      tags:
        - admin
      summary: Uvoz uporabnikov iz CSV datoteke
      responses:
        "200":
          description: Rezultat uvoza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UvozUporabnikovRezultat"
        "400":
          description: Napačna datoteka ali format
          content:
            application/json:
              schema:
                type: object
                required:
                  - napaka
                properties:
                  napaka:
                    type: string
  /admin/testni-zagoni:
    get:
      operationId: listTestniZagoni
      tags:
        - admin
      summary: Zadnji zagoni testov
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestniZagonPogled"
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kategorije:
    get:
      operationId: listKategorije
      tags:
        - kategorije
      summary: Seznam kategorij
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kategorija"
    post:
      operationId: createKategorija
      tags:
        - kategorije
      summary: Ustvari kategorijo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KategorijaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kategorija"
  /kategorije/{id}:
    get:
      operationId: getKategorija
      tags:
        - kategorije
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kategorija"
    put:
      operationId: updateKategorija
      tags:
        - kategorije
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KategorijaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kategorija"
    delete:
      operationId: deleteKategorija
      tags:
        - kategorije
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /artikli:
    get:
      operationId: listArtikli
      tags:
        - artikli
      summary: Seznam artiklov
      parameters:
        - name: kategorijaId
          in: query
          required: false
          schema:
            type:
              - integer
              - "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artikel"
    post:
      operationId: createArtikel
      tags:
        - artikli
      summary: Ustvari artikel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtikelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artikel"
  /artikli/uvozi-csv:
    post:
      operationId: uvozArtiklovCsv
      tags:
        - artikli
      summary: Uvoz artiklov iz CSV datoteke
      parameters:
        - in: query
          name: dryRun
          schema:
            type: boolean
            default: true
          description: true = predogled brez shranjevanja; false = dejanski uvoz
        - in: query
          name: podvojeni
          schema:
            type: string
            enum:
              - preskoči
              - posodobi
            default: preskoči
          description: "Ravnanje s podvojenimi artiklih: preskoči ali posodobi ceno/DDV"
      responses:
        "200":
          description: Rezultat uvoza ali predogleda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UvozArtiklovRezultat"
        "400":
          description: Napačna datoteka ali format
          content:
            application/json:
              schema:
                type: object
                required:
                  - napaka
                properties:
                  napaka:
                    type: string
  /artikli/reorder:
    patch:
      operationId: reorderArtikli
      tags:
        - artikli
      summary: Posodobi vrstni red artiklov
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ArtikelReorderItem"
      responses:
        "204":
          description: No Content
  /artikli/{id}:
    get:
      operationId: getArtikel
      tags:
        - artikli
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artikel"
    put:
      operationId: updateArtikel
      tags:
        - artikli
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtikelInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artikel"
    delete:
      operationId: deleteArtikel
      tags:
        - artikli
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "409":
          description: Artikel se uporablja v normativih
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - vpNormativi
                properties:
                  error:
                    type: string
                  vpNormativi:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - ime
                      properties:
                        id:
                          type: integer
                        ime:
                          type: string
  /artikli/{id}/v-normativi:
    get:
      operationId: getArtikelVNormativi
      tags:
        - artikli
      summary: Kateri artikli vsebujejo ta artikel kot sestavino v normativu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - ime
                  properties:
                    id:
                      type: integer
                    ime:
                      type: string
  /artikli/{id}/normativi:
    get:
      operationId: getArtikelNormativi
      tags:
        - artikli
      summary: Normativ artikla (seznam vhodnih artiklov)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Normativ"
    put:
      operationId: updateArtikelNormativi
      tags:
        - artikli
      summary: Nastavi normativ artikla (zamenja vse vhodne artikle)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/NormativInput"
      responses:
        "204":
          description: No Content
  /artikli/priljubljeni:
    get:
      operationId: listPriljubljeniArtikli
      tags:
        - artikli
      summary: Najpogosteje naroceni artikli
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtikelPopularnost"
  /modifikatorske-skupine:
    get:
      operationId: listModSkupine
      tags:
        - modifikatorji
      summary: Seznam modifikatorskih skupin za to enoto
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModSkupina"
    post:
      operationId: createModSkupina
      tags:
        - modifikatorji
      summary: Ustvari modifikatorsko skupino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModSkupinaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModSkupina"
  /modifikatorske-skupine/{id}:
    get:
      operationId: getModSkupina
      tags:
        - modifikatorji
      summary: Podrobnosti modifikatorske skupine z modifikatorji
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModSkupinaFull"
        "404":
          description: Ni najdeno
    patch:
      operationId: updateModSkupina
      tags:
        - modifikatorji
      summary: Posodobi modifikatorsko skupino
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModSkupinaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModSkupina"
        "404":
          description: Ni najdeno
    delete:
      operationId: deleteModSkupina
      tags:
        - modifikatorji
      summary: Izbriši modifikatorsko skupino
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Ni najdeno
  /modifikatorske-skupine/{id}/modifikatorji:
    post:
      operationId: addModifikator
      tags:
        - modifikatorji
      summary: Dodaj modifikator v skupino
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifikatorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modifikator"
        "404":
          description: Ni najdeno
  /modifikatorji/{id}:
    patch:
      operationId: updateModifikator
      tags:
        - modifikatorji
      summary: Posodobi modifikator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifikatorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modifikator"
        "404":
          description: Ni najdeno
    delete:
      operationId: deleteModifikator
      tags:
        - modifikatorji
      summary: Izbriši modifikator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Ni najdeno
  /modifikatorji/{id}/normativi:
    get:
      operationId: getModifikatorNormativi
      tags:
        - modifikatorji
      summary: Normativ modifikatorja
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModNormativItem"
        "404":
          description: Ni najdeno
    put:
      operationId: setModifikatorNormativi
      tags:
        - modifikatorji
      summary: Nastavi normativ modifikatorja (zamenja obstoječe)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModNormativiPayload"
      responses:
        "204":
          description: No Content
        "404":
          description: Ni najdeno
  /artikli/{id}/modifikatorske-skupine:
    get:
      operationId: getArtikelModSkupine
      tags:
        - modifikatorji
      summary: Modifikatorske skupine za artikel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModSkupinaFull"
    put:
      operationId: setArtikelModSkupine
      tags:
        - modifikatorji
      summary: Nastavi modifikatorske skupine za artikel (zamenja obstoječe)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skupineIds
              properties:
                skupineIds:
                  type: array
                  items:
                    type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Ni najdeno
  /mize:
    get:
      operationId: listMize
      tags:
        - mize
      summary: Seznam miz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Miza"
    post:
      operationId: createMiza
      tags:
        - mize
      summary: Ustvari mizo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MizaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Miza"
  /mize/{id}:
    get:
      operationId: getMiza
      tags:
        - mize
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Miza"
    put:
      operationId: updateMiza
      tags:
        - mize
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MizaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Miza"
    delete:
      operationId: deleteMiza
      tags:
        - mize
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /prostori:
    get:
      operationId: listProstori
      tags:
        - prostori
      summary: Seznam prostorov
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prostor"
    post:
      operationId: createProstor
      tags:
        - prostori
      summary: Ustvari prostor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProstorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prostor"
  /prostori/{id}:
    put:
      operationId: updateProstor
      tags:
        - prostori
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProstorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prostor"
    delete:
      operationId: deleteProstor
      tags:
        - prostori
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /narocila:
    get:
      operationId: listNarocila
      tags:
        - narocila
      summary: Seznam narocil
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
            enum:
              - odprto
              - zakljuceno
              - preklicano
              - null
        - name: mizaId
          in: query
          required: false
          schema:
            type:
              - integer
              - "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Narocilo"
    post:
      operationId: createNarocilo
      tags:
        - narocila
      summary: Ustvari narocilo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarociloInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narocilo"
  /narocila/aktivna:
    get:
      operationId: listAktivnaNarocila
      tags:
        - narocila
      summary: Aktivna odprta narocila po mizah
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Narocilo"
  /narocila/{id}:
    get:
      operationId: getNarocilo
      tags:
        - narocila
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narocilo"
    put:
      operationId: updateNarocilo
      tags:
        - narocila
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarociloUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narocilo"
    delete:
      operationId: deleteNarocilo
      tags:
        - narocila
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
  /narocila/{id}/spoji:
    post:
      operationId: spojiNarocili
      tags:
        - narocila
      summary: Spoji dve narocili iste mize v eno
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Ciljno narocilo (v katerega se prenesejo postavke)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpojiNarocilaInput"
      responses:
        "200":
          description: Posodobljeno ciljno narocilo z vsemi prenesenimipostavkami
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narocilo"
        "400":
          description: Napacna zahteva (npr. razlicni mizi, narocilo ni odprto)
          content:
