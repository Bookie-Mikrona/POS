      allOf:
        - $ref: "#/components/schemas/PaymentBatchRecord"
        - type: object
          properties:
            companyId: { type: string }
            executionDate: { type: string, format: date }
            idempotencyKey: { type: string }
            xmlSnapshot: { type: [string, "null"] }
            items:
              type: array
              items:
                type: object
                properties:
                  paymentId: { type: string }
                  instruction: { $ref: "#/components/schemas/PaymentBatchInstruction" }
                  lifecycleStatus: { type: string, enum: [ready, partially_executed, executed, rejected, cancelled] }
                  resolutionReason: { type: [string, "null"] }
                  resolvedBy: { type: [string, "null"] }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  releasedAt: { type: [string, "null"], format: date-time }
                required: [paymentId, instruction]
          required: [companyId, idempotencyKey, items]
    PaymentBatchLifecycleBody:
      type: object
      properties:
        action: { type: string, enum: [cancel, reject] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        paymentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
          description: Required for partially executed batches; must contain only unexecuted remaining instructions.
        confirmExportedRisk:
          type: boolean
          description: Required after an XML snapshot was exported because the bank may already have received it.
      required: [action, reason]
    PaymentBatchLifecycleResponse:
      type: object
      properties:
        batchId: { type: string }
        status: { type: string, enum: [cancelled, rejected, partially_executed] }
        paymentIds:
          type: array
          items: { type: string }
        releasedForRepackaging:
          type: array
          items: { type: string }
        reason: { type: string }
        exportedWarning: { type: [string, "null"] }
        monetaryReversal: { type: boolean, enum: [false] }
      required: [batchId, status, paymentIds, releasedForRepackaging, reason, exportedWarning, monetaryReversal]
    PaymentBatchLifecycleConflict:
      type: object
      properties:
        error: { type: string }
        confirmationRequired: { type: boolean }
        warning: { type: string }
      required: [error]
