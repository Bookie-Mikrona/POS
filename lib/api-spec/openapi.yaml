components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required: [id, email]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Company:
      type: object
      properties:
        id:
          type: string
        podjetjeDavcna:
          type: string
        naziv:
          type: string
        kratekNaziv:
          type: ["string", "null"]
        naslov:
          type: ["string", "null"]
        postnaStevika:
          type: ["string", "null"]
        kraj:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, podjetjeDavcna, naziv, createdAt]
    CompanyWithRole:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, accountant, viewer]
          required: [role]
    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyWithRole"
      required: [companies]
    CreateCompanyBody:
      type: object
      properties:
        podjetjeDavcna:
          type: string
          minLength: 8
          maxLength: 20
        naziv:
          type: string
          minLength: 1
          maxLength: 200
        kratekNaziv:
          type: string
          maxLength: 50
        naslov:
          type: string
          maxLength: 200
        postnaStevika:
          type: string
          maxLength: 10
        kraj:
          type: string
          maxLength: 100
      required: [podjetjeDavcna, naziv]
    AssignRoleBody:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [clerkUserId, role]
    RoleAssignment:
      type: object
      properties:
        companyId:
          type: string
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [companyId, clerkUserId, role]

    # ── Chart of accounts ────────────────────────────────────────────────────
    AccountRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parentId:
          type: ["string", "null"]
        isActive:
          type: boolean
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, code, name, type, isActive, createdAt, updatedAt]
    ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountRecord"
      required: [accounts]
    CreateAccountBody:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parentId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
      required: [code, name, type]
    UpdateAccountBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        parentId:
          type: ["string", "null"]
    SeedAccountsResponse:
      type: object
      properties:
        count:
          type: integer
      required: [count]

    # ── Accounting periods ───────────────────────────────────────────────────
    PeriodRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [open, locked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, name, startDate, endDate, status, createdAt, updatedAt]
    ListPeriodsResponse:
      type: object
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodRecord"
      required: [periods]
    CreatePeriodBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
