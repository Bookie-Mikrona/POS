                      type: object
                      properties:
                        accountId: { type: string }
                        accountCode: { type: string }
                        accountName: { type: string }
                        debit: { type: string }
                        credit: { type: string }
                        periodBalance: { type: string }
                        openDebit: { type: string }
                        openCredit: { type: string }
                  totals: { type: object, additionalProperties: { type: string } }
                  remainderSemantics: { type: string }
                required: [dateFrom, dateTo, rows, accountTotals, totals, remainderSemantics]
        "400": { description: Invalid period }
        "403": { description: Company access denied }
  /companies/{companyId}/partner-turnover/pdf:
