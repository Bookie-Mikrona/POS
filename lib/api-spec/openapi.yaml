        "403": { description: Company access denied }
  /companies/{companyId}/partner-settlements:
    post:
      operationId: createPartnerSettlements
      tags: [partner-ledger]
      summary: Manually close partner GL lines
      description: >
        Atomically appends one close event per allocation. Every pair must be opposite-side
        posted/reversed GL lines of the same company, partner and account. amount must be positive
        and within each line's currently available remainder. Idempotency keys are unique per
        company; repeat requests do not create duplicate close events. No journal or payment is created.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allocations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      sourceLineId: { type: string }
                      targetLineId: { type: string }
                      amount: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
                    required: [sourceLineId, targetLineId, amount]
                effectiveDate: { type: string, format: date }
                idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
                reason: { type: string, nullable: true }
              required: [allocations, effectiveDate, idempotencyKey]
      responses:
        "201": { description: Appended settlement close events }
        "400": { description: Invalid settlement request }
        "403": { description: Permission denied }
        "409": { description: Remaining balance conflict or duplicate idempotency key }
  /companies/{companyId}/partner-settlements/{id}/reopen:
    post:
      operationId: reopenPartnerSettlement
      tags: [partner-ledger]
      summary: Reopen some or all of one manual close
      description: Appends a partial/full reopen event linked to the exact close event, preserving its historical audit; journal lines remain unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string }, description: Original close event or stable historical closing ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
                effectiveDate: { type: string, format: date }
                idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
                reason: { type: string, minLength: 1 }
              required: [amount, effectiveDate, idempotencyKey, reason]
      responses:
        "201": { description: Appended reopen event }
        "400": { description: Invalid reopen request }
        "403": { description: Permission denied }
        "409": { description: Close not found or requested amount exceeds active close }
