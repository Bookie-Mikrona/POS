        accountInputCode:
          type: ["string", "null"]
        validFrom:
          type: ["string", "null"]
          format: date
        validTo:
          type: ["string", "null"]
          format: date
        isActive:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, code, name, rate, behavior, isActive, createdAt, updatedAt]
    ListVatCodesResponse:
      type: object
      properties:
        vatCodes:
          type: array
          items:
            $ref: "#/components/schemas/VatCodeRecord"
      required: [vatCodes]
    CreateVatCodeBody:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        rate:
          type: number
          minimum: 0
          maximum: 100
        behavior:
          type: string
          enum: [standard, exempt, zero_rated, reverse_charge]
        accountOutputId:
          type: ["string", "null"]
        accountInputId:
          type: ["string", "null"]
        validFrom:
          type: ["string", "null"]
          format: date
        validTo:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]
      required: [code, name, rate]
    UpdateVatCodeBody:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        rate:
          type: number
          minimum: 0
          maximum: 100
        behavior:
          type: string
          enum: [standard, exempt, zero_rated, reverse_charge]
        accountOutputId:
          type: ["string", "null"]
        accountInputId:
          type: ["string", "null"]
        validFrom:
          type: ["string", "null"]
          format: date
        validTo:
          type: ["string", "null"]
          format: date
        isActive:
          type: boolean
        notes:
          type: ["string", "null"]
      required: []
    SeedVatCodesResponse:
      type: object
      properties:
        seeded:
          type: integer
        codes:
          type: array
          items:
            $ref: "#/components/schemas/VatCodeRecord"
      required: [seeded, codes]

    # ── VAT register & DDV-O ──────────────────────────────────────────────────
    VatRegisterLine:
      type: object
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        invoiceType:
          type: string
          enum: [issued, received]
        counterpartyId:
          type: string
        counterpartyName:
          type: string
        counterpartyTaxId:
          type: ["string", "null"]
        vatCodeId:
          type: ["string", "null"]
        vatCode:
          type: ["string", "null"]
        vatRate:
          type: string
          description: Stopnja DDV v %
        vatBase:
          type: string
          description: Davčna osnova
        vatAmount:
          type: string
          description: Znesek DDV
        grossAmount:
          type: string
          description: Bruto (osnova + DDV)
      required: [invoiceId, invoiceNumber, invoiceDate, invoiceType, counterpartyId, counterpartyName, vatRate, vatBase, vatAmount, grossAmount]
    VatRegisterResponse:
      type: object
      properties:
        periodId:
          type: string
        periodName:
          type: string
        dateFrom:
          type: ["string", "null"]
          format: date
        dateTo:
          type: ["string", "null"]
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VatRegisterLine"
        totalVatBase:
          type: string
        totalVatAmount:
          type: string
        totalGross:
          type: string
      required: [periodId, periodName, entries, totalVatBase, totalVatAmount, totalGross]
    VatReturnRow:
      type: object
      properties:
        vatCodeId:
          type: ["string", "null"]
        vatCode:
          type: ["string", "null"]
        vatCodeName:
          type: ["string", "null"]
        vatRate:
          type: string
        outputBase:
          type: string
          description: Izstopni DDV — davčna osnova (izdani računi)
        outputVat:
          type: string
          description: Izstopni DDV — znesek
        inputBase:
          type: string
          description: Vstopni DDV — davčna osnova (prejeti računi)
        inputVat:
          type: string
          description: Vstopni DDV — znesek
        netVat:
          type: string
          description: Neto DDV obveznost (outputVat - inputVat)
      required: [vatRate, outputBase, outputVat, inputBase, inputVat, netVat]
    VatReturnResponse:
      type: object
      properties:
        periodId:
          type: string
        periodName:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/VatReturnRow"
        totals:
          $ref: "#/components/schemas/VatReturnRow"
      required: [periodId, periodName, rows, totals]

    # ── Object Storage ────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Documents (AI OCR) ────────────────────────────────────────────────────
    ProposedLine:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        vatRate:
          type: number
        vatBase:
          type: number
        vatAmount:
          type: number
        accountCode:
          type: ["string", "null"]
        accountId:
          type: ["string", "null"]
        confidence:
          type: number
      required: [description, quantity, unitPrice, vatRate, vatBase, vatAmount, confidence]
    OcrResult:
      type: object
      properties:
        rawText:
          type: string
        confidence:
          type: number
        counterpartyName:
          type: ["string", "null"]
        counterpartyTaxId:
          type: ["string", "null"]
        counterpartyAddress:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        invoiceDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        totalNet:
          type: ["number", "null"]
        totalVat:
          type: ["number", "null"]
        totalGross:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ProposedLine"
        suggestedCounterpartyId:
          type: ["string", "null"]
        suggestedCounterpartyName:
          type: ["string", "null"]
        suggestedDocumentType:
          type: ["string", "null"]
          enum: [invoice_received, invoice_issued, null]
        suggestedPeriodId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [rawText, confidence, lines]
    DocumentRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: ["integer", "null"]
        objectPath:
          type: string
        status:
          type: string
          enum: [pending, processing, done, confirmed, rejected, error]
        documentType:
          type: ["string", "null"]
          enum: [invoice_received, invoice_issued, other, null]
        errorMessage:
          type: ["string", "null"]
        ocrResult:
          oneOf:
            - $ref: "#/components/schemas/OcrResult"
            - type: "null"
        confirmedData:
          oneOf:
            - $ref: "#/components/schemas/OcrResult"
            - type: "null"
        linkedInvoiceId:
          type: ["string", "null"]
        uploadedByClerkId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, fileName, mimeType, objectPath, status, createdAt, updatedAt]
    ListDocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRecord"
      required: [documents]
    CreateDocumentBody:
      type: object
      required: [objectPath, fileName, mimeType]
      properties:
        objectPath:
          type: string
          description: Path returned from requestUploadUrl
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
    ConfirmDocumentBody:
      type: object
      description: Potrdi predlog OCR in (po potrebi) popravi podatke pred ustvarjanjem računa
      properties:
        documentType:
          type: string
          enum: [invoice_received, invoice_issued, other]
        counterpartyId:
          type: ["string", "null"]
        periodId:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        invoiceDate:
          type: ["string", "null"]
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ProposedLine"
        arApAccountId:
          type: ["string", "null"]
          description: Konto terjatev (izdani račun) ali obveznosti (prejet račun); če ni podan, se samodejno poišče privzeti konto (120* ali 220*)
        createInvoice:
          type: boolean
          description: Ali naj se avtomatično ustvari draft račun
      required: []

    # ── Bank statement import ─────────────────────────────────────────────────
    BankTransaction:
      type: object
      description: Single transaction parsed from a bank statement file
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        amount:
          type: number
          description: Positive = credit (inbound), negative = debit (outbound)
        reference:
          type: ["string", "null"]
        counterpartyName:
          type: ["string", "null"]
        counterpartyIban:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        currency:
          type: string
          default: EUR
      required: [id, date, amount, currency]

    ParseBankStatementResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankTransaction"
        count:
          type: integer
      required: [transactions, count]

    MatchBankTransactionsBody:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankTransaction"
          maxItems: 500
      required: [transactions]

    MatchSuggestion:
      type: object
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        counterpartyId:
          type: string
        counterpartyName:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: ["string", "null"]
          format: date
        remainingAmount:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        matchReasons:
          type: array
          items:
            type: string
      required: [invoiceId, invoiceNumber, counterpartyId, counterpartyName, invoiceDate, remainingAmount, confidence, matchReasons]

    TransactionWithSuggestions:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/BankTransaction"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MatchSuggestion"
      required: [transaction, suggestions]

    MatchBankTransactionsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionWithSuggestions"
      required: [suggestions]

    # ── Financial reports ─────────────────────────────────────────────────────
    ReportLineItem:
      type: object
      properties:
        accountId:
          type: string
        accountCode:
          type: string
        accountName:
          type: string
        balance:
          type: string
      required: [accountId, accountCode, accountName, balance]
    ReportSection:
      type: object
      properties:
        class:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportLineItem"
        subtotal:
          type: string
      required: [class, label, items, subtotal]
    BalanceSheetSide:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
        total:
          type: string
      required: [sections, total]
    BalanceSheetData:
      type: object
      properties:
        aktiva:
          $ref: "#/components/schemas/BalanceSheetSide"
        pasiva:
          $ref: "#/components/schemas/BalanceSheetSide"
      required: [aktiva, pasiva]
    BalanceSheetResponse:
      type: object
      properties:
        asOf:
          type: ["string", "null"]
          format: date
        compareAsOf:
          type: ["string", "null"]
          format: date
        current:
          $ref: "#/components/schemas/BalanceSheetData"
        compare:
          oneOf:
            - $ref: "#/components/schemas/BalanceSheetData"
            - type: "null"
      required: [current]
    PLSide:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
        total:
          type: string
      required: [sections, total]
    IncomeStatementData:
      type: object
      properties:
        revenue:
          $ref: "#/components/schemas/PLSide"
        expenses:
          $ref: "#/components/schemas/PLSide"
        netResult:
          type: string
      required: [revenue, expenses, netResult]
    IncomeStatementResponse:
      type: object
      properties:
        dateFrom:
          type: ["string", "null"]
          format: date
        dateTo:
          type: ["string", "null"]
          format: date
        compareDateFrom:
          type: ["string", "null"]
          format: date
        compareDateTo:
          type: ["string", "null"]
          format: date
        current:
          $ref: "#/components/schemas/IncomeStatementData"
        compare:
          oneOf:
            - $ref: "#/components/schemas/IncomeStatementData"
            - type: "null"
      required: [current]

    # ── Anthropic (AI chat) ───────────────────────────────────────────────────
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, createdAt]
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]
    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required: [title]
    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required: [content]
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, createdAt, messages]
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required: [error]
