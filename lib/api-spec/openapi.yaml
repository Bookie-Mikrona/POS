        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDimensionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /companies/{companyId}/departments:
    get:
      operationId: listDepartments
      tags: [dimensions]
      summary: List departments (oddelki)
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Departments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDepartmentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDepartment
      tags: [dimensions]
      summary: Create department
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDimensionBody"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [dimensions]
      summary: Update department
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDimensionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /companies/{companyId}/open-items:
    get:
      operationId: getOpenItems
      tags: [payments]
      summary: Open items (odprte postavke) per counterparty
      description: Returns all posted invoices that are not fully paid, with remaining amount.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: counterpartyId
          in: query
          schema:
            type: string
          description: Filter by counterparty UUID
        - name: type
          in: query
          schema:
            type: string
            enum: [issued, received]
          description: Filter by invoice type
        - name: asOfDate
          in: query
          schema:
            type: string
            format: date
          description: Reference date (defaults to today)
      responses:
        "200":
          description: Open items list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenItemsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/aged-analysis:
    get:
      operationId: getAgedAnalysis
      tags: [payments]
      summary: Aged receivables/payables analysis
      description: Groups open items into aging buckets (current, 1-30, 31-60, 61-90, 90+ days overdue).
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [issued, received]
          description: issued = receivables, received = payables
        - name: asOfDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Aged analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgedAnalysisResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Bank balance (stanje bančnih računov 110x) ───────────────────────────────
  /companies/{companyId}/bank-balance:
    get:
      operationId: getBankBalance
      tags: [ledger]
      summary: Bank account balance — total balance of 110x accounts
      description: Returns the total balance (debit minus credit) of all accounts with code starting with 110 for the given company.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bank balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBalanceResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── General ledger (konto kartica) ──────────────────────────────────────────
  /companies/{companyId}/ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: General ledger — movements per account
      description: Returns posted journal entry lines for the given filters, with running balance.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
          description: Filter by account UUID
        - name: periodId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ledger lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Financial reports ────────────────────────────────────────────────────────
  /companies/{companyId}/reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      tags: [reports]
      summary: Balance sheet (bilanca stanja) grouped by SRS account class
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: asOf
          in: query
          schema:
            type: string
            format: date
          description: Cut-off date (defaults to today)
        - name: compareAsOf
          in: query
          schema:
            type: string
            format: date
          description: Optional comparison cut-off date (e.g. previous year-end)
      responses:
        "200":
          description: Balance sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSheetResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/{companyId}/reports/income-statement:
    get:
      operationId: getIncomeStatement
      tags: [reports]
      summary: Income statement (izkaz poslovnega izida) — revenues minus expenses
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: compareDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: compareDateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Income statement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeStatementResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Documents (AI/OCR obdelava) ─────────────────────────────────────────────
  /companies/{companyId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List uploaded documents for a company
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, done, confirmed, rejected, error]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/documents/register:
    post:
      operationId: registerDocument
      tags: [documents]
      summary: Register an uploaded document and trigger AI/OCR processing
      description: |
        After uploading the file to object storage via /storage/uploads/request-url,
        register it here to trigger async OCR extraction. Status changes to processing,
        then done (with ocrResult) or error.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectPath:
                  type: string
                fileName:
                  type: string
                mimeType:
                  type: string
                fileSizeBytes:
                  type: integer
              required: [objectPath, fileName, mimeType]
      responses:
        "201":
          description: Document registered and OCR started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document detail with OCR result
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/documents/{id}/confirm:
    post:
      operationId: confirmDocument
      tags: [documents]
      summary: Confirm OCR proposal and optionally create a draft invoice
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDocumentBody"
      responses:
        "200":
          description: Document confirmed, invoice draft created (if requested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        "400":
          description: Validation error or document not in reviewable status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /companies/{companyId}/documents/{id}/reject:
    post:
      operationId: rejectDocument
      tags: [documents]
      summary: Reject an OCR proposal
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Object Storage ────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      security:
        - bearerAuth: []
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden — caller does not belong to the company that owns this object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Anthropic AI chat ─────────────────────────────────────────────────────────
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required: [id, email]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Company:
      type: object
      properties:
        id:
          type: string
        podjetjeDavcna:
          type: string
        naziv:
          type: string
        kratekNaziv:
          type: ["string", "null"]
        naslov:
          type: ["string", "null"]
        postnaStevika:
          type: ["string", "null"]
        kraj:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, podjetjeDavcna, naziv, createdAt]
    CompanyWithRole:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            role:
              type: string
              enum: [owner, accountant, viewer]
          required: [role]
    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CompanyWithRole"
      required: [companies]
    CreateCompanyBody:
      type: object
      properties:
        podjetjeDavcna:
          type: string
          minLength: 8
          maxLength: 20
        naziv:
          type: string
          minLength: 1
          maxLength: 200
        kratekNaziv:
          type: string
          maxLength: 50
        naslov:
          type: string
          maxLength: 200
        postnaStevika:
          type: string
          maxLength: 10
        kraj:
          type: string
          maxLength: 100
      required: [podjetjeDavcna, naziv]
    AssignRoleBody:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [clerkUserId, role]
    RoleAssignment:
      type: object
      properties:
        companyId:
          type: string
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, accountant, viewer]
      required: [companyId, clerkUserId, role]

    # ── Dimensions ───────────────────────────────────────────────────────────
    DimensionRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, code, name, isActive, createdAt, updatedAt]
    CostCenterRecord:
      $ref: "#/components/schemas/DimensionRecord"
    ProjectRecord:
      $ref: "#/components/schemas/DimensionRecord"
    DepartmentRecord:
      $ref: "#/components/schemas/DimensionRecord"
    ListCostCentersResponse:
      type: object
      properties:
        costCenters:
          type: array
          items:
            $ref: "#/components/schemas/CostCenterRecord"
      required: [costCenters]
    ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRecord"
      required: [projects]
    ListDepartmentsResponse:
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentRecord"
      required: [departments]
    CreateDimensionBody:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
      required: [code, name]
    UpdateDimensionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
        isActive:
          type: boolean

    # ── Chart of accounts ────────────────────────────────────────────────────
    AccountRecord:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parentId:
          type: ["string", "null"]
        isActive:
          type: boolean
        description:
          type: ["string", "null"]
        allowsPosting:
          type: boolean
          description: Ali se sme na ta konto knjižiti (false = skupinski konto)
        requiresPartner:
          type: boolean
          description: Vrstica temeljnice mora imeti poslovnega partnerja
        requiresCostCenter:
          type: boolean
          description: Vrstica temeljnice mora imeti stroškovno mesto
        requiresProject:
          type: boolean
          description: Vrstica temeljnice mora imeti projekt
        taxBehavior:
          type: string
          enum: [none, output_vat, input_vat, exempt]
          description: DDV vedenje konta
        isCash:
          type: boolean
          description: Denarno/bančno sredstvo (blagajna, TRR) — za izkaz denarnih tokov
        isOpenItem:
          type: boolean
          description: Saldakontni konto — kupci in dobavitelji z odprtimi postavkami
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, companyId, code, name, type, isActive, allowsPosting, requiresPartner, requiresCostCenter, requiresProject, taxBehavior, isCash, isOpenItem, createdAt, updatedAt]
    ListAccountsResponse:
      type: object
      properties:
