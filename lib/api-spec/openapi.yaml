      properties:
        currentAverage: { type: [number, "null"] }
        previousAverage: { type: [number, "null"] }
        difference:
          description: Absolutna sprememba v ocenjevalnih točkah (trenutno minus prejšnje), null brez obeh povprečij.
          type: [number, "null"]
        direction: { type: string, enum: [improved, declined, unchanged, unavailable] }
        directionReason:
          description: Pojasnilo, zakaj smer ni določena; številčna razlika lahko kljub temu ostane informativno prikazana.
          type: [string, "null"]
    QrFeedbackComparison:
      type: object
      required: [current, previous, dimensions]
      properties:
        current: { $ref: "#/components/schemas/QrFeedbackComparisonPeriod" }
        previous: { $ref: "#/components/schemas/QrFeedbackComparisonPeriod" }
        dimensions:
          type: object
          required: [food, ambience, service]
          properties:
            food: { $ref: "#/components/schemas/QrFeedbackComparisonMetric" }
            ambience: { $ref: "#/components/schemas/QrFeedbackComparisonMetric" }
            service: { $ref: "#/components/schemas/QrFeedbackComparisonMetric" }
    QrFeedbackTrend:
      type: object
      required: [periodStart, periodEnd, responses, foodAverage, ambienceAverage, serviceAverage, smallSample]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        responses: { type: integer, minimum: 0 }
        foodAverage: { type: [number, "null"] }
        ambienceAverage: { type: [number, "null"] }
        serviceAverage: { type: [number, "null"] }
        smallSample: { type: boolean }
    QrFeedbackArticle:
      type: object
      required: [articleName, current, previous, difference, direction, directionReason]
      properties:
        articleName: { type: string }
        current: { $ref: "#/components/schemas/QrFeedbackMetric" }
        previous: { $ref: "#/components/schemas/QrFeedbackMetric" }
        difference:
          description: Absolutna sprememba ocene artikla (trenutno minus prejšnje), null brez obeh vzorcev.
          type: [number, "null"]
        direction: { type: string, enum: [improved, declined, unchanged, unavailable] }
        directionReason:
          description: Pojasnilo, zakaj smer ni določena; null, ko je smer primerljiva.
          type: [string, "null"]
    QrFeedbackWarning:
      type: object
      required: [code, minimumSample, message]
      properties:
        code: { type: string, enum: [SMALL_SAMPLE] }
        minimumSample: { type: integer, enum: [5] }
        message: { type: string }
    QrFeedbackReport:
      type: object
      required: [scope, totals, dimensions, comparison, trends, articles, warnings, comments]
      properties:
        scope:
          allOf:
            - { $ref: "#/components/schemas/QrFeedbackScope" }
          required: [granularity]
        totals:
          type: object
          required: [responses, smallSample, minimumSample]
          properties:
            responses: { type: integer, minimum: 0 }
            smallSample: { type: boolean }
            minimumSample: { type: integer, enum: [5] }
        dimensions:
          type: object
          required: [food, ambience, service]
          properties:
            food: { $ref: "#/components/schemas/QrFeedbackMetric" }
            ambience: { $ref: "#/components/schemas/QrFeedbackMetric" }
            service: { $ref: "#/components/schemas/QrFeedbackMetric" }
        comparison: { $ref: "#/components/schemas/QrFeedbackComparison" }
        trends:
          type: array
          items: { $ref: "#/components/schemas/QrFeedbackTrend" }
        articles:
          type: array
          items: { $ref: "#/components/schemas/QrFeedbackArticle" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/QrFeedbackWarning" }
        comments:
          type: object
          required: [count, protected]
          properties:
            count: { type: integer, minimum: 0 }
            protected: { type: boolean, enum: [true] }
    QrFeedbackComment:
