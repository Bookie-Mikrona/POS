    Opozorilo:
      type: object
      properties:
        koda: { type: string, example: POS006 }
        resnost: { type: string, enum: [B, O, I] }
        sporocilo: { type: string }
        polje: { type: string, nullable: true }
        postavka_id: { type: integer, format: int64, nullable: true }
        podatki: { type: object, additionalProperties: true }
        potrdil_uporabnik: { type: integer, format: int64, nullable: true }
        potrjeno_dne: { type: string, format: date-time, nullable: true }
        opomba: { type: string, nullable: true }

    Napaka:
      type: object
      properties:
        koda: { type: string }
        sporocilo: { type: string }
        podrobnosti: { type: object, additionalProperties: true }
        cas: { type: string, format: date-time }
