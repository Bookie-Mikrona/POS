kind = "web"
previewPath = "/"
title = "ERP — Dvostavno Knjigovodstvo"
version = "1.0.0"
id = "artifacts/erp-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19239

[services.development]
run = "pnpm --filter @workspace/erp-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/erp-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19239"
BASE_PATH = "/"
