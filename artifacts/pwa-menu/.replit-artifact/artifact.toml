kind = "web"
previewPath = "/meni/"
title = "Bookie QR meni"
description = "Samostojni javni meni za goste v lokalu. Gost brez prijave pregleda artikle, izbere modifikatorje in odda QR naročilo na mizi."
version = "1.0.0"
id = "artifacts/pwa-menu"
router = "path"

[[services]]
name = "web"
paths = [ "/meni/" ]
localPort = 20010

[services.development]
run = "pnpm --filter @workspace/pwa-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pwa-menu", "run", "build" ]
serve = "static"
publicDir = "artifacts/pwa-menu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20010"
BASE_PATH = "/meni/"
