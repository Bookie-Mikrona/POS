<!DOCTYPE html>
<html lang="sl">
  <head>
    <!-- Prestreže window.addEventListener PRED /@vite/client, ki se naloži za tem.
         S tem Vite-ov runtime-error-overlay ne dobi ResizeObserver napak,
         ki so benigni Chrome opozorili in ne vplivajo na delovanje. -->
    <script>
      (function () {
        var _ael = window.addEventListener.bind(window);
        window.addEventListener = function (type, fn, opts) {
          if (type === "error") {
            return _ael(type, function (e) {
              if (
                e.message === "ResizeObserver loop completed with undelivered notifications." ||
                e.message === "ResizeObserver loop limit exceeded"
              ) {
                e.stopImmediatePropagation();
                return;
              }
              return fn.call(this, e);
            }, opts);
          }
          return _ael(type, fn, opts);
        };
      })();
    </script>
